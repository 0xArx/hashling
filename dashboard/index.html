<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hashling</title>
  <meta name="color-scheme" content="light">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="Sections">
      <a class="brand" href="#/overview">
        <span class="brand-mark"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="hl-brand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B7DFB"/><stop offset="1" stop-color="#5F4FE0"/></linearGradient></defs><g fill="url(#hl-brand)"><rect x="38" y="10" width="15" height="98" rx="7.5" transform="skewX(-10)" transform-origin="45.5 59"/><rect x="67" y="10" width="15" height="98" rx="7.5" transform="skewX(-10)" transform-origin="74.5 59"/><rect x="16" y="36" width="90" height="15" rx="7.5"/><rect x="13" y="68" width="90" height="15" rx="7.5"/></g></svg></span>
        <div><b>Hashling</b><span>Your AI security agent</span></div>
      </a>
      <nav class="nav" id="nav"></nav>
      <a class="side-score" id="side-score" href="#/overview"></a>
    </aside>
    <main>
      <header class="topbar" id="topbar">
        <div><h1 id="title">Overview</h1><p id="subtitle"></p></div>
        <div class="actions">
          <span id="live" class="live" title="Live connection to Hashling">Live</span>
          <button class="btn ai" data-act="assistant" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Ask Hashling</button>
        </div>
      </header>
      <div class="page" id="main" tabindex="-1"><div class="loading">Loading…</div></div>
    </main>
    <aside class="dock" id="dock" hidden aria-label="Hashling assistant"><div class="dock-resize" id="dock-resize" role="separator" aria-orientation="vertical" aria-label="Resize the assistant" tabindex="0"></div><div class="dock-inner" id="dock-inner"></div></aside>
  </div>
  <div id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-bg" data-close></div><section class="drawer-panel" id="drawer-panel"></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
